# Ambiente de desenvolvimento. O código é montado do host, então rode com o seu
# usuário (UID/GID) para os arquivos gerados não ficarem como root.
services:
  app:
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "8080:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    # Só nesta máquina (127.0.0.1), para clientes como o DBeaver. A 3306 do host já está em uso.
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dbdata:
