; Comprovantes do IR: até 5 MB por arquivo.
upload_max_filesize = 6M
post_max_size = 8M

expose_php = Off

; Mitigação do CVE-2026-109619 enquanto não sai a imagem do FrankenPHP com PHP 8.4.27.
; O Laravel não usa a sessão nativa do PHP, então desligar não muda nada no sistema.
session.upload_progress.enabled = 0

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
; O código só muda com uma imagem nova, então não vale conferir os arquivos a cada requisição.
opcache.validate_timestamps = 0
